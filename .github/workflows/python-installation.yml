name: Installing Python

on:
  push:
    branches:
      - feature
      - main

jobs:
  build:
    concurrency:
      group: prod-deploy
      cancel-in-progress: true
    runs-on: '${{ matrix.os }}'
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - windows-latest
        py-version: 
          - "3.10"
          - "3.11"
          - "3.12"
        exclude :
           - os: macos-14
             py-version: "3.12"
        include :
           - os : macos-14
             py-version: "3.9"
    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '${{ matrix.py-version }}'

    - name: Docer info12
      run:  echo "'${{ matrix.os }}' '${{ matrix.py-version }}'"
      
    
        
